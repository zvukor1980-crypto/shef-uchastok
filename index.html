<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Участок Хайфы · Шеф полиции</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Участок">
<meta name="theme-color" content="#12386f">
<meta name="description" content="Сказочный полицейский участок Хайфы: героини, расследования, патруль, прокачка комнат и бесплатные улучшения.">
<link rel="manifest" href="manifest.webmanifest?v=17">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<style>
/* Critical: hide overlays and cap images even if style.css is stale, missing, or cached by an old SW */
.hidden{display:none!important}
html,body{margin:0;padding:0;height:100%;height:100dvh;min-height:-webkit-fill-available;overflow:hidden;overscroll-behavior:none;background:#3db4f0;-webkit-text-size-adjust:100%}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
img{display:block;max-width:100%;max-height:100%;height:auto;object-fit:contain}
.ld-icon{width:128px;height:128px;max-width:128px;max-height:20vh;object-fit:cover;border-radius:28px}
.avatar{width:48px;height:48px;max-width:48px;max-height:48px;object-fit:cover;border-radius:50%;flex:none;min-width:0}
.qb-ava,#questbar img,#nikatip img{width:36px;height:36px;max-width:36px;max-height:36px;object-fit:cover;border-radius:50%;flex:none;min-width:0}
#coachava,#coach img{width:92px;max-width:92px;max-height:28vh;height:auto;object-fit:contain;flex:none;min-width:0}
.wing{width:100%;aspect-ratio:900/1600}
#scene{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.actor{max-width:18%;max-height:28vh}
.actor img,#actors img{width:100%;max-width:100%;max-height:28vh;height:auto;object-fit:contain}
.hcard img,.seat img,.reveal img,.flip-face img,.iq-card img,.assignee img{max-width:100%;max-height:42vh;object-fit:contain}
#loading{position:absolute;inset:0;z-index:50}
#cinema .unlock-room{width:70%;max-width:280px;max-height:40vh;object-fit:contain}
</style>
<link rel="stylesheet" href="style.css?v=17">
</head>
<body>
<div id="app">
  <div id="loading">
    <img class="ld-icon" src="apple-touch-icon.png" alt="" width="128" height="128">
    <div class="ld-title">ШЕФ ПОЛИЦИИ<br><span>УЧАСТОК</span></div>
    <div class="ld-bar"><i id="ldfill"></i></div>
    <div class="ld-txt" id="ldtxt">Загрузка…</div>
  </div>

  <div id="game" class="hidden">
    <header id="topbar">
      <div class="tb-row">
        <img class="avatar" id="avatar" src="assets/avatar.webp" alt="" width="48" height="48">
        <div class="tb-title">
          <b>ШЕФ ПОЛИЦИИ</b>
          <span>Иерусалим · ур. <i id="chiefLv">1</i></span>
        </div>
        <button class="icon-btn" id="btnMute" data-act="mute" aria-label="Звук">🔊</button>
      </div>
      <div class="res-row" id="resrow"></div>
      <div class="sat-row"><span>Удовлетворённость</span><div class="sat-bar"><i id="satfill"></i></div><b id="satn">0</b></div>
      <div id="questbar" data-testid="questbar" role="status" aria-label="Текущий шаг">
        <img class="qb-ava" src="assets/heroes/nika.webp" alt="" width="32" height="32">
        <div class="qb-txt">
          <b id="queststep">Шаг 1 из 12</b>
          <span id="questtxt">Посади дежурную за стол</span>
        </div>
        <button type="button" class="qb-help" data-act="questhelp" data-testid="quest-help" aria-label="Перейти к заданию" title="Перейти к заданию">Перейти →</button>
        <button type="button" class="qb-skip hidden" id="questskip" data-act="guideskip" data-testid="quest-skip">Пропустить</button>
        <i id="combobadge" class="hidden">×1</i>
      </div>
    </header>

    <div id="roomnav" aria-label="Быстрый доступ к комнатам">
      <button data-act="open" data-arg="reception">📋 Приёмная</button>
      <button data-act="open" data-arg="detective">🔎 Детектив</button>
      <button data-act="open" data-arg="garage">🚓 Патруль</button>
      <button data-act="open" data-arg="interrog">💬 Допрос</button>
      <button data-act="open" data-arg="cells">🔐 Камеры</button>
      <button data-act="open" data-arg="chief">⭐ Шеф</button>
      <button data-act="open" data-arg="armory">🛡️ Оружейная</button>
      <button data-act="open" data-arg="electric">⚡ Щитовая</button>
      <button data-act="open" data-arg="gasstation">⛽ Заправка</button>
      <button data-act="open" data-arg="suggest">💌 Идеи</button>
      <button data-act="open" data-arg="press">📣 Пресс-центр</button>
    </div>
    <div id="stage">
      <div id="precinct">
        <div id="campus">
          <canvas id="scene" aria-label="Полицейский участок"></canvas>
          <div class="wing" id="wing1"></div>
          <div class="wing" id="wing2"></div>
          <div id="daytint"></div>
          <div id="hotspots"></div>
          <div id="actors"></div>
          <div id="bubbles"></div>
          <div id="labels"></div>
        </div>
      </div>
      <div id="hint">▼ листайте вниз — ещё комнаты ▼</div>
    </div>

    <div id="sheet" class="hidden"></div>

    <nav id="tabs">
      <button class="tab on" data-act="tab" data-arg="station" data-testid="tab-station"><span class="ti">🏛️</span>Участок</button>
      <button class="tab" data-act="tab" data-arg="heroes" data-testid="tab-heroes"><span class="ti">⭐</span>Героини</button>
      <button class="tab" data-act="tab" data-arg="tasks" data-testid="tab-tasks"><span class="ti">📋</span>Задания</button>
      <button class="tab shop" data-act="tab" data-arg="shop" data-testid="tab-shop"><span class="ti">🛒</span>Магазин<div class="free">БЕСПЛАТНО</div></button>
    </nav>
  </div>

  <div id="pulsering" class="hidden" aria-hidden="true" data-testid="pulsering"></div>
  <div id="pointer" class="hidden" aria-hidden="true"><span class="finger">👇</span></div>
  <div id="nikatip" class="hidden" data-testid="nikatip">
    <img src="assets/heroes/nika.webp" alt="" width="36" height="36">
    <p id="nikatiptxt"></p>
    <button type="button" class="tip-x" data-act="closetip" data-testid="tip-close" aria-label="Закрыть">✕</button>
  </div>
  <div id="coach" class="hidden">
    <img id="coachava" src="assets/heroes/nika.webp" alt="Ника" width="92" height="103">
    <div class="coach-b">
      <button type="button" class="coach-x" data-act="guideskip" data-testid="guide-x" aria-label="Закрыть">✕</button>
      <b>Ника</b>
      <p id="coachtxt"></p>
      <div class="coach-actions">
        <button type="button" class="btn grey" id="coachskip" data-act="guideskip" data-testid="guide-skip">Пропустить</button>
        <button type="button" class="btn" id="coachbtn" data-act="guidenext" data-testid="guide-next">Дальше</button>
      </div>
    </div>
  </div>
  <div id="fx"></div>
  <div id="cinema" class="hidden"></div>
  <div id="iq" class="hidden"></div>
  <div id="modal" class="hidden"></div>
  <div id="toasts"></div>
</div>
<script src="data.js?v=17"></script>
<script src="render.js?v=17"></script>
<script src="game.js?v=17"></script>
</body>
</html>
