<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Шеф полиции: Участок</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Участок">
<meta name="theme-color" content="#1a6db5">
<meta name="description" content="Управляйте полицейским участком: принимайте заявления, расследуйте дела, проводите допросы и улучшайте комнаты.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="loading">
    <img class="ld-icon" src="apple-touch-icon.png" alt="">
    <div class="ld-title">ШЕФ ПОЛИЦИИ<br><span>УЧАСТОК</span></div>
    <div class="ld-bar"><i id="ldfill"></i></div>
    <div class="ld-txt" id="ldtxt">Загрузка…</div>
  </div>

  <div id="game" class="hidden">
    <header id="topbar">
      <div class="tb-row">
        <img class="avatar" id="avatar" src="assets/avatar.webp" alt="">
        <div class="tb-title">
          <b>ШЕФ ПОЛИЦИИ</b>
          <span>Участок · ур. <i id="chiefLv">1</i></span>
        </div>
        <button class="icon-btn" id="btnMute" data-act="mute" aria-label="Звук">🔊</button>
      </div>
      <div class="res-row" id="resrow"></div>
      <div class="sat-row"><span>Удовлетворённость</span><div class="sat-bar"><i id="satfill"></i></div><b id="satn">0</b></div>
      <button type="button" id="questbar" data-testid="questbar" aria-label="Следующее дело">
        <img class="qb-ava" src="assets/heroes/nika.webp" alt="">
        <div class="qb-txt"><b>Следующее дело</b><span id="questtxt">Добро пожаловать в участок!</span></div>
        <i id="combobadge" class="hidden">×1</i>
      </button>
    </header>

    <div id="stage">
      <div id="precinct">
        <div id="campus">
          <div class="wing" id="wing1">
            <img src="assets/rooms/wing-start.webp" alt="Участок" draggable="false">
          </div>
          <div class="wing" id="wing2">
            <img src="assets/rooms/wing-more.webp" alt="Новые комнаты" draggable="false">
          </div>
          <div id="daytint"></div>
          <div id="hotspots"></div>
          <div id="actors"></div>
          <div id="bubbles"></div>
          <div id="labels"></div>
        </div>
      </div>
      <div id="hint">▼ листайте вниз — ещё комнаты ▼</div>
    </div>

    <div id="sheet" class="hidden"></div>

    <nav id="tabs">
      <button class="tab on" data-act="tab" data-arg="station" data-testid="tab-station"><span class="ti">🏛️</span>Участок</button>
      <button class="tab" data-act="tab" data-arg="heroes" data-testid="tab-heroes"><span class="ti">⭐</span>Героини</button>
      <button class="tab" data-act="tab" data-arg="tasks" data-testid="tab-tasks"><span class="ti">📋</span>Задания</button>
      <button class="tab shop" data-act="tab" data-arg="shop" data-testid="tab-shop"><span class="ti">🛒</span>Магазин<div class="free">БЕСПЛАТНО</div></button>
    </nav>
  </div>

  <div id="pointer" class="hidden" aria-hidden="true"><span class="finger">👇</span></div>
  <div id="coach" class="hidden">
    <img id="coachava" src="assets/heroes/nika.webp" alt="Ника">
    <div class="coach-b">
      <b>Ника</b>
      <p id="coachtxt"></p>
      <button class="btn" id="coachbtn" data-act="guidenext" data-testid="guide-next">Дальше</button>
    </div>
  </div>
  <div id="fx"></div>
  <div id="cinema" class="hidden"></div>
  <div id="iq" class="hidden"></div>
  <div id="modal" class="hidden"></div>
  <div id="toasts"></div>
</div>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
